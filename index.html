<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Personal Training</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <span class="overline">PERSONAL TRAINING</span>
        <h1>Technical Growth</h1>
        <p>Track your hands-on progress, week by week.</p>
      </div>
      <button id="openLog" class="primary">+ Log Training</button>
    </header>

    <section class="stats">
      <article class="stat-card">
        <span>This week</span>
        <strong id="weekTotal">0h</strong>
        <small>Across all tracks</small>
      </article>
      <article class="stat-card">
        <span>Total training</span>
        <strong id="allTotal">0h</strong>
        <small>Since you started</small>
      </article>
    </section>

    <section class="section">
      <div class="section-heading">
        <div>
          <span class="overline">ACTIVE TRACKS</span>
          <h2>Technical skills</h2>
        </div>
      </div>

      <div id="tracks" class="track-grid"></div>
    </section>

    <section class="section history-section">
      <div class="section-heading">
        <div>
          <span class="overline">HISTORY</span>
          <h2>Recent training</h2>
        </div>
        <button id="clearAll" class="ghost">Reset</button>
      </div>
      <div id="recentList" class="history-card"></div>
    </section>
  </main>

  <dialog id="logDialog">
    <form id="logForm" class="modal" method="dialog">
      <div class="modal-head">
        <div>
          <span class="overline">NEW SESSION</span>
          <h2>Log training</h2>
        </div>
        <button type="button" class="icon-btn" data-close="logDialog">×</button>
      </div>

      <label>
        Technical skill
        <select id="trackSelect"></select>
      </label>

      <label>
        What did you train?
        <input id="topicInput" type="text" placeholder="e.g. Windows Event Logs" required />
      </label>

      <div class="time-row">
        <label>
          Hours
          <input id="hoursInput" type="number" min="0" max="24" value="1" />
        </label>
        <label>
          Minutes
          <input id="minutesInput" type="number" min="0" max="59" step="5" value="0" />
        </label>
      </div>

      <button class="primary full" type="submit">Save Session</button>
    </form>
  </dialog>

  <dialog id="roadmapDialog">
    <div class="modal">
      <div class="modal-head">
        <div>
          <span class="overline" id="roadmapType"></span>
          <h2 id="roadmapTitle"></h2>
        </div>
        <button type="button" class="icon-btn" data-close="roadmapDialog">×</button>
      </div>

      <div class="roadmap-summary">
        <div class="roadmap-copy">
          <span>Roadmap progress</span>
          <strong id="roadmapDone">0 / 0</strong>
        </div>
        <div class="roadmap-progress">
          <div id="roadmapProgress"></div>
        </div>
      </div>

      <div id="roadmapList" class="roadmap-list"></div>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
