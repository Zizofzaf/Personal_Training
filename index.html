<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Training Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div>
        <p class="kicker">PERSONAL TRAINING</p>
        <h1>Technical Growth</h1>
      </div>
      <button id="openLog" class="add-btn">+ Log</button>
    </header>

    <section class="summary">
      <div>
        <span>This week</span>
        <strong id="weekTotal">0h</strong>
      </div>
      <div>
        <span>Total</span>
        <strong id="allTotal">0h</strong>
      </div>
    </section>

    <section id="tracks" class="tracks"></section>

    <section class="recent">
      <div class="section-title">
        <h2>Recent</h2>
        <button id="clearAll" class="text-btn">Reset</button>
      </div>
      <div id="recentList" class="recent-list"></div>
    </section>
  </main>

  <dialog id="logDialog">
    <form id="logForm" method="dialog" class="sheet">
      <div class="sheet-head">
        <h2>Log training</h2>
        <button type="button" class="close" data-close="logDialog">×</button>
      </div>

      <label>
        Track
        <select id="trackSelect"></select>
      </label>

      <label>
        Topic
        <input id="topicInput" placeholder="What did you train?" required />
      </label>

      <div class="time-grid">
        <label>
          Hours
          <input id="hoursInput" type="number" min="0" max="24" value="1" />
        </label>
        <label>
          Minutes
          <input id="minutesInput" type="number" min="0" max="59" step="5" value="0" />
        </label>
      </div>

      <button class="save-btn" type="submit">Save</button>
    </form>
  </dialog>

  <dialog id="roadmapDialog">
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <p class="kicker" id="roadmapType"></p>
          <h2 id="roadmapTitle"></h2>
        </div>
        <button type="button" class="close" data-close="roadmapDialog">×</button>
      </div>

      <div id="roadmapList" class="roadmap-list"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
